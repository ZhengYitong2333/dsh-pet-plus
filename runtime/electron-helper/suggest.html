<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大肥鱼 · 三条建议</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body {
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        padding: 8px;
        -webkit-app-region: drag;
      }
      .card {
        height: 100%;
        border-radius: 16px;
        background: rgba(20, 24, 34, 0.97);
        border: 1px solid rgba(129, 140, 248, 0.35);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        color: #e2e8f0;
      }
      .head { display: flex; align-items: center; justify-content: space-between; color: #a5b4fc; font-size: 12px; margin-bottom: 8px; -webkit-app-region: no-drag; }
      .x { cursor: pointer; padding: 2px 6px; border-radius: 6px; color: #94a3b8; }
      .x:hover { background: rgba(148, 163, 184, 0.15); color: #fff; }
      .list { flex: 1; display: flex; flex-direction: column; gap: 6px; -webkit-app-region: no-drag; }
      button {
        text-align: left;
        padding: 8px 10px;
        border-radius: 9px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(30, 41, 59, 0.75);
        color: #e2e8f0;
        font-size: 12px;
        line-height: 1.4;
        cursor: pointer;
        display: flex;
        gap: 8px;
      }
      button:hover { background: rgba(79, 70, 229, 0.3); border-color: rgba(129, 140, 248, 0.7); }
      button b { color: #818cf8; font-weight: 700; }
      .foot { margin-top: 8px; display: flex; justify-content: space-between; color: #64748b; font-size: 11px; -webkit-app-region: no-drag; }
      .empty { color: #94a3b8; font-size: 12px; padding: 12px 2px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head"><span>大肥鱼 · 三条建议</span><span class="x" id="close" title="关闭 (Esc)">✕</span></div>
      <div class="list" id="list"><div class="empty">正在想…</div></div>
      <div class="foot"><span>1 / 2 / 3 选择 · Esc 关闭</span><span>点击后复制</span></div>
    </div>
    <script src="./suggest.js"></script>
  </body>
</html>
